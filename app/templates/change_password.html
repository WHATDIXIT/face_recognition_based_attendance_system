{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Change Password / पासवर्ड बदलें</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if success %}<div class="success">{{ success }}</div>{% endif %}
  <form method="post">
    <label>Current Password: <input name="current_password" type="password" required></label>
    <label>New Password: <input name="new_password" type="password" required></label>
    <label>Confirm New: <input name="confirm_password" type="password" required></label>
    <div class="controls"><button type="submit">Change Password</button></div>
  </form>
</section>
{% endblock %}
